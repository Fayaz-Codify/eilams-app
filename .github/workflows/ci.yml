name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Expo / React Native peer tree currently needs npm's legacy peer resolver.
      - run: npm ci --legacy-peer-deps

      - run: npm run check

      # Bundle all three targets to catch native-only and web-only import issues.
      - run: npx expo export --platform android --output-dir /tmp/eilams-android
      - run: npx expo export --platform ios --output-dir /tmp/eilams-ios
      - run: npx expo export --platform web --output-dir dist
