name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The pinned React version sits one patch behind what react-dom asks for,
      # so npm needs --legacy-peer-deps to resolve the tree at all.
      - run: npm ci --legacy-peer-deps

      - run: npx tsc --noEmit

      # A production bundle catches broken imports and bad route config that a
      # type check cannot see.
      - run: npx expo export --platform web --output-dir dist
